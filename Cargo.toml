[workspace]
members = ["engine", "cli"]
resolver = "2"

[package]
name = "chess-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web server stack
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }

# Chess engine crate
chess = "3.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
hmac = "0.13.0"
sha2 = "0.11.0"
chrono = "0.4.45"

# Android-safe replacements
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["term"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
termios = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
