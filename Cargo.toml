[package]
name = "chess-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
chess = "3.2.0"

# Database + time
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

# Replace termios with nix (Termux-compatible)
nix = { version = "0.31", features = ["term"] }
