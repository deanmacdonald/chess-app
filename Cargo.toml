[workspace]
members = ["api", "engine", "cli"]
resolver = "2"
[package]
name = "chess-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Web server stack
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Chess engine crate
chess = "3.2.0"

# Android-safe replacements
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["term"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
termios = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
